<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MY PATH Pro | مسیر من</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.95);
      --border: rgba(255, 215, 0, 0.25);
      --accent: #ffd700;
      --accent-glow: rgba(255, 215, 0, 0.4);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --success: #2ea043;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(180deg, rgba(255,215,0,0.12) 0%, rgba(11,14,20,0) 100%);
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .app-title {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 1px;
      text-shadow: 0 0 15px var(--accent-glow);
    }

    .date-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: bold;
    }

    .quote {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 8px;
      font-style: italic;
    }

    .container {
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 14, 20, 0.98);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 20%;
      font-weight: bold;
    }

    .nav-btn.active { color: var(--accent); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-number {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .schedule-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      margin-bottom: 8px;
      border-right: 3px solid var(--accent);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .schedule-item.done {
      opacity: 0.45;
      border-right-color: var(--success);
      text-decoration: line-through;
    }

    .schedule-time {
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: bold;
    }

    .schedule-task {
      font-size: 0.88rem;
      margin-top: 2px;
    }

    .custom-checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .schedule-item.done .custom-checkbox {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
